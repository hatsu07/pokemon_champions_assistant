name: Windows desktop development validation

# Draft PRs are for code changes; ready PRs validate on every new revision.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# Superseded runs must not publish artifacts or count as current validation.
concurrency:
  group: desktop-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  desktop-windows-validation:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # GitHub PR checkout defaults to a synthetic merge commit.
          # Validate the source revision explicitly.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out commit matches the triggering revision
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:EXPECTED_SHA) {
            throw "Checkout SHA $checkedOut differs from CI target $env:EXPECTED_SHA"
          }
          Write-Host "Validating exact source revision: $checkedOut"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Run offline battle and settings tests on Windows
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest tests.test_phase_6 tests.test_phase_8_settings tests.test_phase_6r_calibration tests.test_vision_api_benchmark tests.test_api_credentials tests.test_siwc_auth tests.test_selection_vision tests.test_match_replay tests.test_auto_match_capture tests.test_turn_capture_and_reasoning tests.test_screen_classifier tests.test_terminology tests.test_phase_2 -v
          if ($LASTEXITCODE -ne 0) { throw "battle and non-GUI screen classifier suites failed" }
          # A separate Python/Qt process prevents nondeterministic Qt/ML DLL
          # finalization after mixing unrelated test lifecycles.
          python -m unittest tests.test_chatgpt_settings_inline tests.test_unified_main_match_support -v
          if ($LASTEXITCODE -ne 0) { throw "inline GUI regression suites failed" }
          python scripts/windows_qt_test_runner.py
          if ($LASTEXITCODE -ne 0) { throw "Qt UI test runner failed" }
          python -m unittest tests.test_screen_dataset_collector -v
          if ($LASTEXITCODE -ne 0) { throw "private dataset collector tests failed" }
      - name: Check whether a validated screen model is available
        shell: pwsh
        run: |
          python scripts/check_screen_model_release.py
          if ($LASTEXITCODE -ne 0) { throw "model diagnostic failed" }
          # Development CI may run with no trained model, but that build is
          # never labelled as releasable. A real release must call --release.
      - name: Stage non-private live assets for the desktop GUI
        shell: pwsh
        run: |
          $destination = ".\\build\\desktop-assets\\masters"
          New-Item -ItemType Directory -Force $destination | Out-Null
          $files = @(
            "Pokemon_Champions_MC_live_decision_gate.txt",
            "Pokemon_Champions_MC_live_selection_matrix.txt",
            "Pokemon_Champions_MC_60sec_lookup_master.txt",
            "Pokemon_Champions_MC_usable_pokemon.csv",
            "Pokemon_Champions_MC_move_master.csv",
            "Pokemon_Champions_MC_usable_held_items.csv",
            "Pokemon_Champions_MC_ability_master.csv",
            "Pokemon_Champions_MC_pokemon_learnsets_linked.csv"
          )
          foreach ($file in $files) {
            Copy-Item -LiteralPath (Join-Path ".\\masters" $file) -Destination (Join-Path $destination $file) -Force
          }
      - name: Build portable Windows desktop GUI (not MSI)
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name PokemonChampionsAssistant --paths src
          --hidden-import PIL.ImageGrab --collect-binaries cv2 --collect-all onnxruntime --collect-data champions_assist --collect-all PySide6
          --add-data "build\\desktop-assets\\masters;masters"
          scripts/windows_desktop_entry.py
      - name: Build standalone local dataset collector GUI
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name PokemonChampionsScreenDataCollector --paths src
          --hidden-import PIL.ImageGrab --collect-binaries cv2 --collect-all PySide6
          scripts/windows_screen_dataset_collector_entry.py
      - name: Smoke desktop GUI headlessly with isolated local settings, no capture/API
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = Resolve-Path .\\dist\\PokemonChampionsAssistant\\PokemonChampionsAssistant.exe
          $report = Join-Path $env:RUNNER_TEMP "desktop-smoke.json"
          # GUI-subsystem Windows executables must be explicitly waited for.
          # In PowerShell, direct '& $exe' may return before a windowed process
          # finishes, leaving $LASTEXITCODE unset or stale from another program.
          $process = Start-Process -FilePath $exe.Path -ArgumentList @('--smoke', ('"' + $report + '"')) -Wait -PassThru
          Write-Host "Desktop GUI smoke exit code: $($process.ExitCode)"
          if ($process.ExitCode -ne 0) {
            $diagnostics = Join-Path $env:LOCALAPPDATA "PokemonChampionsAssistant\\diagnostics"
            if (Test-Path -LiteralPath $diagnostics) {
              Get-ChildItem -LiteralPath $diagnostics -Filter "startup-*.log" -File |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 3 |
                ForEach-Object { Write-Host ("=== " + $_.Name + " ==="); Get-Content -LiteralPath $_.FullName }
            }
            throw "portable desktop GUI startup smoke failed (actual exit code $($process.ExitCode))"
          }
          if (-not (Test-Path -LiteralPath $report)) { throw "missing desktop startup smoke report" }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne "GUI_DESKTOP_SMOKE_OK" -or $result.network -ne "NOT_USED") {
            throw "desktop GUI startup smoke returned unexpected report"
          }
          Remove-Item Env:QT_QPA_PLATFORM
      - name: Smoke dataset collector GUI offline (no actual screen access)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $exe = Resolve-Path .\\dist\\PokemonChampionsScreenDataCollector\\PokemonChampionsScreenDataCollector.exe
          $report = Join-Path $env:RUNNER_TEMP "collector-smoke.json"
          $proc = Start-Process -FilePath $exe.Path -ArgumentList @('--smoke', ('"' + $report + '"')) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "dataset collector GUI startup smoke failed" }
          if (-not (Test-Path -LiteralPath $report)) { throw "missing dataset collector smoke report" }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.status -ne "SCREEN_DATASET_COLLECTOR_SMOKE_OK" -or
              $result.network -ne "NOT_USED" -or
              $result.screenshot_files -ne "NOT_CREATED") {
            throw "dataset collector smoke produced an unexpected result"
          }
          Remove-Item Env:QT_QPA_PLATFORM
      - name: Verify PR head is still current before releasing artifact
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($checkedOut -ne $env:EXPECTED_SHA) {
            throw "Checkout SHA changed during build; refusing stale artifact"
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "pokemon-champions-ci"
          }
          $url = "https://api.github.com/repos/${{ github.repository }}/pulls/$env:PR_NUMBER"
          $current = Invoke-RestMethod -Uri $url -Headers $headers -Method Get
          if ($current.head.sha -ne $checkedOut) {
            throw "PR HEAD moved to $($current.head.sha) while building $checkedOut; refusing stale artifact"
          }
          Write-Host "Verified current PR head SHA: $checkedOut"
      - name: Embed build revision into portable distribution
        shell: pwsh
        run: |
          $built = (git rev-parse HEAD).Trim()
          @(
            "commit_sha=$built"
            "workflow_run_id=${{ github.run_id }}"
            "workflow_run_attempt=${{ github.run_attempt }}"
            "artifact_type=DEVELOPMENT_ONLY"
            "screen_model_release_validated=false"
          ) | Set-Content -LiteralPath ".\\dist\\PokemonChampionsAssistant\\BUILD_REVISION.txt" -Encoding UTF8
          @(
            "commit_sha=$built"
            "workflow_run_id=${{ github.run_id }}"
            "workflow_run_attempt=${{ github.run_attempt }}"
            "artifact_type=SCREEN_DATASET_COLLECTOR_DEVELOPMENT"
            "screenshots_auto_saved=false"
            "network_upload=false"
          ) | Set-Content -LiteralPath ".\\dist\\PokemonChampionsScreenDataCollector\\BUILD_REVISION.txt" -Encoding UTF8
      - name: Upload local screen dataset collector Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokemonChampionsScreenDataCollector-DEVELOPMENT-windows-x64
          path: dist/PokemonChampionsScreenDataCollector/
          if-no-files-found: error
      - name: Upload diagnostic-only Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          # GitHub Actions wraps this folder into ONE download ZIP. Do not
          # Compress-Archive inside it: that created the double ZIP problem.
          name: PokemonChampionsAssistant-DEVELOPMENT-windows-x64
          path: dist/PokemonChampionsAssistant/
          if-no-files-found: error
