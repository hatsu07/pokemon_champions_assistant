name: Phase 0 Showdown isolated PoC

on:
  pull_request:
    paths:
      - 'poc/showdown_phase0/**'
      - '.github/workflows/showdown-phase0-poc.yml'
      - '.gitattributes'
      - 'masters/Pokemon_Champions_MC_*.csv'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase0-linux-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checkout matches current PR HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Verified checkout SHA: $(git rev-parse HEAD)"
          echo "CHECKED_OUT_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build fixed SHA in isolated container
        run: docker build -f poc/showdown_phase0/Dockerfile -t champions-phase0 .
      - name: Test fail-closed adoption assessment
        run: docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 --test test_decision.cjs test_state_compare.cjs test_audit.cjs test_golden_compare.cjs test_wiki_damage_reference.cjs test_champions_rule_reference.cjs test_champions_event_probe.cjs test_gate_b_probe.cjs test_six_team_selection_probe.cjs test_partial_observation_probe.cjs test_representative_states_probe.cjs test_game_evidence_bridge.cjs test_cross_process_synthetic_probe.cjs test_gate_a_evidence_inventory.cjs test_champions_ap_stat_reference.cjs test_champions_damage_modifier_probe.cjs
      - name: Audit 9 Champions modifier conditions and exact known source rounding divergence
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 champions_damage_modifier_probe.cjs > phase0-damage-modifier.json
          python3 - <<'PY'
          import json
          with open("phase0-damage-modifier.json",encoding="utf-8") as f:
              r=json.load(f)
          assert r["schema"]=="phase0-champions-damage-modifier-diagnostic-v1"
          assert r["pinned_sha"]=="ccfaa20f32af363569cd21a9d501b2bc1ded26b1"
          assert r["format"]=="gen9championsbssregmc"
          assert (r["gate_A"],r["gate_B"],r["adoption"])==("UNKNOWN","UNSUPPORTED","NO_GO")
          assert r["scenario_count"]==9 and r["individual_roll_comparisons"]==144
          assert r["odd_rounding_witness_count"]>0
          assert r["odd_rounding_witness_verified_in_pinned_getDamage"] is True
          assert r["counts"]=={"WIKI_SPEC_MATCH":8,"WIKI_SPEC_MISMATCH":1}
          assert r["source_divergence_count"]==1
          assert r["reviewed_source_divergence"]=="PINNED_SPLIT_ROUNDING_VS_SECONDARY_COMBINED_MODIFIER"
          assert r["unknown_source_divergences_accepted"] is False
          odd=next(x for x in r["results"] if x["id"]=="neutral-type-burn-and-reflect")
          assert odd["status"]=="WIKI_SPEC_MISMATCH" and odd["difference_count"]==4
          assert [x["roll_pct"] for x in odd["first_differences"]]==[86,90,91,98]
          assert all(w["pinned_damage"]==w["split_rounding"] and
                     w["pinned_damage"]!=w["combined_rounding"] for w in odd["odd_rounding_witnesses"])
          assert r["game_verified_check_count"]==0
          assert r["executed_turns"]==0
          assert r["private_golden_read"] is False and r["live_use_approved"] is False
          assert len(r["results"])==9
          for row in r["results"]:
              assert row["status"]==("WIKI_SPEC_MISMATCH" if row["id"]=="neutral-type-burn-and-reflect" else "WIKI_SPEC_MATCH")
              assert row["difference_count"]==(4 if row["id"]=="neutral-type-burn-and-reflect" else 0)
              print("DAMAGE_MODIFIER="+json.dumps({
                  "id":row["id"],"conditions":row["conditions"],
                  "reference_range":row["reference_range"],
                  "pinned_range":row["pinned_range"],
                  "status":row["status"],
                  "odd_rounding_witnesses":row["odd_rounding_witnesses"]
              },sort_keys=True))
          print("Reviewed secondary-source divergence is a FINDING, not a gameplay parity PASS")
          PY
      - name: Cross-check independent Champions AP stat arithmetic against pinned selected battle bodies
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 champions_ap_stat_probe.cjs > phase0-ap-stat-source.json
          python3 - <<'PY'
          import json
          with open("phase0-ap-stat-source.json", encoding="utf-8") as f:
              r=json.load(f)
          assert r['schema']=='phase0-champions-ap-stat-source-comparison-v1'
          assert r['pinned_sha']=='ccfaa20f32af363569cd21a9d501b2bc1ded26b1'
          assert r['format']=='gen9championsbssregmc'
          assert (r['gate_A'],r['gate_B'],r['adoption'])==('UNKNOWN','UNSUPPORTED','NO_GO')
          assert r['case_count']==384
          assert r['individual_stat_comparisons']==2304
          assert r['varied_ap_stat_count']==6
          assert r['ap_targets']==['hp','atk','def','spa','spd','spe']
          assert r['varied_ap_case_counts']=={
              'hp':64,'atk':64,'def':64,'spa':64,'spd':64,'spe':64
          }
          assert r['registration_ap_zero_fallback_cases']==48
          assert r['selected_form_scope']=='TWO_BASE_SPECIES_ONLY'
          assert r['published_speed_reference_checks']==14
          assert r['counts']=={'SOURCE_SPEC_MATCH':384,'SOURCE_SPEC_MISMATCH':0}
          assert r['private_golden_read'] is False
          assert r['game_case_count']==0
          assert r['official_or_game_confirmed'] is False
          assert r['live_use_approved'] is False
          assert r['registered_six_member_teams'] is True
          assert r['selected_three_member_teams'] is True
          print('Champions community-source stat reference: 384 synthetic cases/2304 comparisons, AP varied in all 6 stats')
          print('This does NOT establish in-game speed order or damage equivalence.')
          PY
      - name: Audit Gate A source evidence, conflicts and unverified LIVE risks
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 gate_a_evidence_inventory.cjs > phase0-gate-a-evidence.json
          python3 - <<'PY'
          import json
          with open("phase0-gate-a-evidence.json", encoding="utf-8") as f:
              r=json.load(f)
          assert r["schema"]=="phase0-gate-a-evidence-inventory-v1"
          assert r["pinned_sha"]=="ccfaa20f32af363569cd21a9d501b2bc1ded26b1"
          assert r["format"]=="gen9championsbssregmc"
          assert (r["gate_A"],r["gate_B"],r["adoption"])==("UNKNOWN","UNSUPPORTED","NO_GO")
          assert r["feature_count"]==10
          assert r["event_rule_count"]==5 and r["event_case_count"]==18
          assert r["wiki_comparable_count"]==1
          assert r["game_verified_cases_this_run"]==0 and r["game_verified_checks_this_run"]==0
          assert r["private_golden_read"] is False and r["safe_to_integrate_with_live"] is False
          for f in r["features"]:
              assert f["feature_compatibility"]=="UNKNOWN"
              assert f["allowed_as_certain_ko_or_safe_switch_proof"] is False
              print("GATE_A_FEATURE="+json.dumps({
                  "feature":f["feature"],"static_status":f["static_status"],
                  "static_disagreement_count":f["static_disagreement_count"],
                  "wiki_arithmetic_status":f["wiki_arithmetic_status"],
                  "event_evidence_counts":f["event_evidence_counts"],
                  "next_evidence":f["next_evidence"],
              },ensure_ascii=False,sort_keys=True))
          print("Gate A evidence inventory: source-only; no private Golden uploaded")
          PY
      - name: Diagnose three independent Linux Node process replays
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 cross_process_synthetic_probe.cjs > phase0-cross-process.json
          python3 - <<'PY'
          import json
          with open('phase0-cross-process.json', encoding='utf-8') as f:
              result = json.load(f)
          assert result['schema'] == 'phase0-cross-process-synthetic-validation-v1'
          assert result['platform'] == 'linux'
          assert (result['gate_A'], result['gate_B'], result['adoption']) == ('UNKNOWN','UNSUPPORTED','NO_GO')
          assert result['independent_os_process_count'] == 3
          assert result['cases_per_process'] == 127
          assert result['total_case_invocations'] == 381
          assert result['unique_real_game_cases'] == 0
          assert result['cross_process_signatures_equal'] is True
          assert result['game_compatibility_verified'] is False
          assert result['independent_ci_runs_verified'] is False
          for stage in result['node_stage_ms']['values'].values():
              assert stage['samples'] == 381
          print('Linux Node: same 127 synthetic states in three separate processes')
          print('Per-process wall-time:', result['process_wall_ms'])
          print('Native Node stage time:', result['node_stage_ms']['values'])
          PY

      - name: Diagnose representative synthetic conditions, duplicate guards and stage performance
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 representative_states_probe.cjs > phase0-representative-states.json
          python3 - <<'PY'
          import json
          with open('phase0-representative-states.json', encoding='utf-8') as stream:
              report = json.load(stream)
          with open('poc/showdown_phase0/representative_states_cases.json', encoding='utf-8') as stream:
              manifest = json.load(stream)
          assert report['schema'] == 'phase0-representative-synthetic-states-v1'
          assert report['pinned_showdown_sha'] == 'ccfaa20f32af363569cd21a9d501b2bc1ded26b1'
          assert report['format'] == 'gen9championsbssregmc'
          assert (report['gate_A'], report['gate_B'], report['adoption']) == ('UNKNOWN', 'UNSUPPORTED', 'NO_GO')
          assert report['evidence_class'] == 'SYNTHETIC_ONLY'
          assert report['case_count'] == len(manifest['cases']) == 127
          assert report['distinct_complete_states'] == 127
          assert report['distinct_tactical_states'] == 127
          assert report['distinct_matchups'] == 18
          assert report['distinct_mechanisms'] == 8
          assert report['counts'] == {'PASS_SYNTHETIC':127, 'UNSUPPORTED':0}
          assert report['representative_100_synthetic_states_met'] is True
          assert report['native_game_verification'] is False
          assert report['windows_e2e_verified'] is False
          assert report['repetitions'] == 0
          assert [(r['case_id'],r['mechanism'],r['status']) for r in report['results']] == [
              (c['id'],c['mechanism'],c['expected_status']) for c in manifest['cases']]
          for entry in report['results']:
              assert entry['branch']['source_unchanged']
              assert entry['branch']['repeated_action_identical']
              assert entry['branch']['distinct_outcome']
              print('REPRESENTATIVE_CASE_JSON=' + json.dumps({k:entry.get(k) for k in (
                  'case_id','mechanism','pair_id','evidence_class','status','current_species',
                  'state_sha256','tactical_sha256','setup_provenance','reason')}, sort_keys=True))
          print('Representative synthetic coverage:', report['counts'])
          print('Full state / tactical / matchups / mechanisms:',
              report['distinct_complete_states'], report['distinct_tactical_states'],
              report['distinct_matchups'], report['distinct_mechanisms'])
          print('Representative synthetic stage latency:', report['timing_ms'])
          print('Representative synthetic process memory:', report['memory_bytes'])
          PY
      - name: Audit synthetic-only Golden evidence boundary (never upload private game data)
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 game_evidence_bridge.cjs --golden synthetic_golden_example.json > phase0-evidence-boundary.json
          python3 - <<'PY'
          import json
          with open("phase0-evidence-boundary.json", encoding="utf-8") as src:
              result=json.load(src)
          assert result["schema"] == "phase0-local-evidence-boundary-v1"
          assert (result["gate_A"],result["gate_B"],result["adoption"]) == ("UNKNOWN","UNSUPPORTED","NO_GO")
          assert result["golden_scalar"]["origin_counts"] == {"REAL_GAME":0,"SYNTHETIC":1}
          assert result["golden_scalar"]["comparison_counts"]["verified_game_check_count"] == 0
          assert result["golden_scalar"]["fact_source_counts"]["GAME_OBSERVED"] == 0
          assert result["golden_scalar"]["b_midbattle_fields_transferred"] == 0
          assert result["partial_board"] is None
          assert result["observations_independently_authenticated"] is False
          assert result["B_full_snapshot_created"] is False
          assert result["game_golden_promoted_to_B"] is False
          print("Offline evidence boundary: synthetic fixture only, zero observed game checks, no B snapshot")
          PY
      - name: Diagnose registered six, selected three and restored branches
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 six_team_selection_probe.cjs > phase0-six-team-selection.json
          python3 - <<'PY'
          import hashlib
          import json
          with open('phase0-six-team-selection.json', encoding='utf-8') as stream:
              report = json.load(stream)
          with open('poc/showdown_phase0/six_team_selection_cases.json', encoding='utf-8') as stream:
              manifest = json.load(stream)
          assert report['schema'] == 'phase0-six-team-selection-diagnostics-v1'
          assert report['pinned_showdown_sha'] == 'ccfaa20f32af363569cd21a9d501b2bc1ded26b1'
          assert report['format'] == 'gen9championsbssregmc'
          assert report['regulation'] == 'M-C'
          assert (report['gate_A'], report['gate_B'], report['adoption']) == ('UNKNOWN', 'UNSUPPORTED', 'NO_GO')
          assert len(report['champions_master_sha256']) == 4
          assert all(len(value) == 64 for value in report['champions_master_sha256'].values())
          for name, digest in report['champions_master_sha256'].items():
              with open('masters/' + name, 'rb') as stream:
                  assert hashlib.sha256(stream.read()).hexdigest() == digest
          assert manifest['schema'] == 'phase0-six-team-selection-cases-v1'
          assert report['positive_case_count'] == 4
          assert report['negative_case_count'] == 21
          assert report['registered_team_pair_count'] == 1
          assert report['selection_pattern_count'] == 3
          assert report['distinct_input_state_count'] == 4
          assert report['repetitions'] == 0
          assert report['representative_100_cases_met'] is False
          assert report['counts'] == {
              'PASS_SYNTHETIC': 4, 'REJECTED_INVALID_REGISTRATION': 16,
              'REJECTED_INVALID_SELECTION': 5, 'SELECTION_MISMATCH': 0,
              'STATE_OR_QUEUE_MISMATCH': 0, 'INCONCLUSIVE': 0, 'UNSUPPORTED': 0}
          actual = [(r['case_id'], r['mechanism'], r['status']) for r in report['results']]
          expected = [(r['id'], r['mechanism'], r['expected_status']) for r in manifest['cases']]
          if len(actual) != 25 or actual != expected:
              print('::error title=Six-team regression::Case identity, coverage or status changed')
              print('EXPECTED=' + json.dumps(expected))
              print('ACTUAL=' + json.dumps(actual))
              raise SystemExit(1)
          for result in report['results']:
              if result['case_id'].startswith('REG-'):
                  assert result['registration'][0]['legal'] and result['registration'][1]['legal']
                  assert result['selection_status'] == 'PASS'
                  assert result['restoration_status'] == 'PASS_SYNTHETIC'
                  assert result['battle_progressed']
                  assert all(side['passed'] for side in result['selected'])
                  assert all(result['restoration']['branch_independence'].values())
              else:
                  assert not result['battle_progressed']
                  assert result['restoration_status'] == 'NOT_RUN'
              print('SIX_TEAM_CASE_JSON=' + json.dumps({
                  key: result.get(key) for key in ('case_id', 'mechanism', 'status',
                      'rejection_stage', 'selection_status', 'restoration_status',
                      'first_difference_field', 'reason')}, ensure_ascii=False, sort_keys=True))
          print('Six-team synthetic counts:', report['counts'])
          print('Distinct registered pairs / selections / input states:',
                report['registered_team_pair_count'], report['selection_pattern_count'],
                report['distinct_input_state_count'])
          PY
      - name: Diagnose partial observations and unknown-state hypotheses
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 partial_observation_probe.cjs > phase0-partial-observation.json
          python3 - <<'PY'
          import hashlib
          import json
          with open('phase0-partial-observation.json', encoding='utf-8') as stream:
              report = json.load(stream)
          with open('poc/showdown_phase0/partial_observation_cases.json', encoding='utf-8') as stream:
              manifest = json.load(stream)
          assert report['schema'] == 'phase0-partial-observation-diagnostics-v1'
          assert report['pinned_showdown_sha'] == 'ccfaa20f32af363569cd21a9d501b2bc1ded26b1'
          assert report['format'] == 'gen9championsbssregmc'
          assert (report['gate_A'], report['gate_B'], report['adoption']) == ('UNKNOWN', 'UNSUPPORTED', 'NO_GO')
          assert len(report['champions_master_sha256']) == 4
          for name, digest in report['champions_master_sha256'].items():
              with open('masters/' + name, 'rb') as stream:
                  assert hashlib.sha256(stream.read()).hexdigest() == digest
          assert manifest['schema'] == 'phase0-partial-observation-cases-v1'
          assert report['case_count'] == report['mechanism_count'] == len(manifest['cases']) == 26
          assert report['counts'] == {
              'CONSISTENT_HYPOTHESES': 10, 'CONTRADICTORY_OBSERVATION': 1,
              'INCONCLUSIVE': 6, 'UNSUPPORTED': 2, 'SYNTHETIC_TEST_PASS': 7}
          assert report['distinct_complete_truth_state_count'] == 9
          assert report['distinct_partial_observation_count'] == 12
          assert report['distinct_hypothesis_set_count'] == 6
          assert report['distinct_candidate_state_hash_count'] == 4
          assert report['candidate_evaluations'] == 96
          assert report['repetitions'] == 0 and report['representative_100_cases_met'] is False
          actual = [(r['case_id'], r['mechanism'], r['status']) for r in report['results']]
          expected = [(c['id'], c['mechanism'], c['expected_status']) for c in manifest['cases']]
          if actual != expected or len(set(r['case_id'] for r in report['results'])) != 26:
              print('::error title=Partial observation regression::Case identity or status changed')
              print('EXPECTED=' + json.dumps(expected))
              print('ACTUAL=' + json.dumps(actual))
              raise SystemExit(1)
          for result in report['results']:
              assert result['evidence_class'] == 'SYNTHETIC_ONLY'
              assert not result['complete_snapshot_restorable_from_observation']
              assert not result['unique_truth_restoration']
              assert result['missing_internal_state'] and result['candidate_independence']
              assert all(fact['source'] != 'GAME_OBSERVED' for fact in result['observation']['facts'].values())
              print('PARTIAL_CASE_JSON=' + json.dumps({
                  key: result.get(key) for key in ('case_id', 'mechanism', 'status',
                      'partial_state_sha256', 'legal_hypothesis_count',
                      'unevaluated_candidate_count', 'candidate_independence',
                      'missing_internal_state', 'contradiction', 'reason')},
                  ensure_ascii=False, sort_keys=True))
          print('Partial observation counts:', report['counts'])
          print('Independent truth / partial / hypothesis / candidate states:',
                report['distinct_complete_truth_state_count'],
                report['distinct_partial_observation_count'],
                report['distinct_hypothesis_set_count'],
                report['distinct_candidate_state_hash_count'])
          PY
      - name: Diagnose Gate B full snapshots and partial observations
        shell: bash
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp --entrypoint node champions-phase0 gate_b_probe.cjs > phase0-gate-b.json
          python3 - <<'PY'
          import json
          with open('phase0-gate-b.json', encoding='utf-8') as stream:
              report = json.load(stream)
          with open('poc/showdown_phase0/gate_b_cases.json', encoding='utf-8') as stream:
              manifest = json.load(stream)
          assert report['schema'] == 'phase0-gate-b-diagnostics-v1'
          assert (report['gate_A'], report['gate_B'], report['adoption']) == ('UNKNOWN', 'UNSUPPORTED', 'NO_GO')
          assert report['pinned_showdown_sha'] == 'ccfaa20f32af363569cd21a9d501b2bc1ded26b1'
          assert len(report['champions_master_sha256']) == 4
          assert all(len(value) == 64 for value in report['champions_master_sha256'].values())
          assert report['case_count'] == len(manifest['cases']) == 14
          assert report['mechanism_count'] == 14
          assert report['unique_input_state_count'] == 11
          assert report['representative_100_cases_met'] is False
          actual = [(r['case_id'], r['mechanism'], r['status']) for r in report['results']]
          expected = [(r['id'], r['mechanism'], r['expected_status']) for r in manifest['cases']]
          print('Gate B B1/B2 counts:', report['counts'])
          print('Gate B distinct state inputs / cases:', report['unique_input_state_count'], report['case_count'])
          print('Gate B stage latency ms:', report['stage_latency_ms'])
          for result in report['results']:
              print('GATE_B_CASE_JSON=' + json.dumps({
                  key: result.get(key) for key in ('case_id', 'phase', 'mechanism', 'status',
                      'evidence_class', 'input_state_sha256', 'first_difference_field',
                      'continuation_actions', 'action_ids', 'branch_independence',
                      'unsupported_fields', 'reason')}, sort_keys=True))
          if actual != expected:
              print('::error title=Gate B regression::Case status or coverage changed')
              print('EXPECTED=' + json.dumps(expected))
              print('ACTUAL=' + json.dumps(actual))
              raise SystemExit(1)
          assert report['counts']['B1']['PASS_SYNTHETIC'] == 12
          assert report['counts']['B2']['INCONCLUSIVE'] == 2
          assert all(result['status'] != 'PASS_SYNTHETIC' for result in report['results'] if result['phase'] == 'B2')
          PY
      - name: Compare source contracts with executed pinned Showdown turns
        shell: bash
        run: |
          docker run --rm --network none --read-only --entrypoint node champions-phase0 champions_event_probe.cjs > phase0-event-probe.json
          python3 - <<'PY'
          import json
          with open('phase0-event-probe.json', encoding='utf-8') as stream:
              report = json.load(stream)
          assert report['schema'] == 'champions-showdown-event-diagnostics-v1'
          assert report['pinned_sha'] == 'ccfaa20f32af363569cd21a9d501b2bc1ded26b1'
          assert (report['gate_A'], report['gate_B'], report['adoption']) == ('UNKNOWN', 'UNSUPPORTED', 'NO_GO')
          assert len({item['rule_id'] for item in report['results']}) == 5
          assert sum(report['counts'].values()) == len(report['results'])
          for item in report['results']:
              assert item['status'] in ('WIKI_SPEC_MATCH', 'WIKI_SPEC_MISMATCH', 'INCONCLUSIVE')
              if item['status'] == 'INCONCLUSIVE':
                  assert item['reason'] and item['unverified_conditions']
              if item['status'] == 'WIKI_SPEC_MATCH':
                  assert not item['mismatched_fields']
          # Diagnostic discovery and regression acceptance are separate: a mismatch is
          # not a Champions game bug, but an unreviewed difference MUST fail this CI.
          with open('poc/showdown_phase0/champions_event_baseline.json', encoding='utf-8') as stream:
              baseline = json.load(stream)
          assert baseline['schema'] == 'champions-event-probe-baseline-v1'
          assert baseline['pinned_sha'] == report['pinned_sha']
          expected = baseline['cases']
          observed = [{k: item[k] for k in ('id', 'rule_id', 'status', 'observation_basis')}
                      for item in report['results']]
          print('Pinned turn diagnostics:', report['counts'])
          print('Evidence basis:', report['observation_basis_counts'])
          for item in report['results']:
              if item['status'] != 'WIKI_SPEC_MATCH':
                  level = 'error' if item['status'] == 'WIKI_SPEC_MISMATCH' else 'warning'
                  print('::' + level + ' title=Champions source-rule diagnostic::' +
                        item['id'] + ': ' + item['status'])
                  print('TRIAGE_EVENT_JSON=' + json.dumps({
                      k: item.get(k) for k in ('id','rule_id','status','reason','mismatched_fields',
                                                   'observation_basis','unverified_conditions')
                  }, ensure_ascii=False, sort_keys=True))
          expected_kinds = ('EXECUTED_TURN','REQUEST_AFTER_TURN','SOURCE_ONLY')
          actual_kind_counts = {k: sum(x['observation_basis'] == k for x in observed)
                                for k in expected_kinds}
          if (observed != expected
                  or len({x['id'] for x in observed}) != len(observed)
                  or report['observation_basis_counts'] != actual_kind_counts):
              print('::error title=Champions event regression::Expected individual case IDs, '
                    'status and observation basis differ from the reviewed baseline')
              print('EXPECTED_CASES=' + json.dumps(expected, sort_keys=True))
              print('ACTUAL_CASES=' + json.dumps(observed, sort_keys=True))
              raise SystemExit(1)
          assert report['counts'] == {
              k: sum(x['status'] == k for x in observed)
              for k in ('WIKI_SPEC_MATCH','WIKI_SPEC_MISMATCH','INCONCLUSIVE')
          }
          print('Reviewed event baseline: PASS (not actual-game compatibility)')
          PY
      - name: Compare documented Wiki arithmetic to pinned Showdown (diagnostic only)
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only --entrypoint node champions-phase0 wiki_damage_compare.cjs
          result=$?
          set -e
          if [ "$result" -eq 2 ]; then
            echo "::error::Wiki comparison did not run; inspect pinned engine or fixture failure"
            exit 2
          fi
          if [ "$result" -ne 0 ]; then
            echo "::warning::Wiki and Showdown calculation differ; triage source versions and rules. Not real-game proof."
          fi
      - name: Execute 120 synthetic fork samples
        run: |
          docker run --rm champions-phase0 > phase0-result.json
          python3 - <<'PY'
          import json
          with open("phase0-result.json", encoding="utf-8") as f:
              report = json.load(f)
          print("Showdown SHA:", report["pinned_sha"])
          print("Format:", report["probe"]["format"])
          print("Independent gates:", report["decision"]["gate_A_calculation"], report["decision"]["gate_B_midbattle"])
          bench = report["benchmark"]
          print("Bench valid / requested:", bench["completed"], bench["requested"])
          print("Iterations / unique input hashes / manifest cases / mechanism tags:",
                bench["iterations"], bench["unique_fixture_count"],
                bench["validated_manifest_case_count"], bench["distinct_mechanism_tag_count"])
          print("Manifest groups covered / missing:", bench["covered_required_groups"],
                bench["missing_required_groups"])
          print("Manifest case evidence:", bench["evaluated_manifest_cases"])
          print("Representative-100 requirement:", report["decision"]["representative_100_cases_met"])
          print("Missing representative mechanisms:", bench["uncovered_mechanisms"])
          print("Timed stages (Node synthetic):", bench["stage_latency_ms"])
          print("Unknown opponent hypothesis probe ms:",
                report["probe"]["results"]["unknown_sets"].get("hypothesis_probe_ms"))
          print("P50/P95/P99 ms:", bench["p50_ms"], bench["p95_ms"], bench["p99_ms"])
          print("Startup and probe ms:", report["startup_and_probe_ms"])
          print("Worker memory bytes:", bench["memory"])
          print("Unverified cases detail:", {k: v.get("detail") for k, v in report["probe"]["results"].items() if v.get("status") != "PASS_SYNTHETIC"})
          print("Pending-choice trace:", json.dumps(report["probe"]["results"]["pending_choice"], ensure_ascii=False, sort_keys=True))
          print("Unsupported cases:", bench["unsupported"])
          print("Probe cases:", {k: v.get("status") for k, v in report["probe"]["results"].items()})
          print("Failed branches:", [dict(index=i, **s) for i, s in enumerate(bench["timings"]) if s["status"] != "PASS_SYNTHETIC"])
          for failure in bench["failed_cases"]:
              print("PHASE0_REPLAY_FAILURE_JSON=" +
                    json.dumps(failure, ensure_ascii=False, sort_keys=True))
          regression = report["probe"]["results"]["replay_regression"]
          print("Seeded regression cases / failures:", regression["attempts"], regression["failure_count"])
          for failure in regression["failures"]:
              print("PHASE0_REPLAY_REGRESSION_FAILURE_JSON=" +
                    json.dumps(failure, ensure_ascii=False, sort_keys=True))
          print("Diagnostic CI is not Phase 0 replay acceptance:",
                report["decision"]["phase0_replay_acceptance_met"])
          print("All repeated branches exactly reproducible:",
                report["decision"]["synthetic_replay_all_consistent"])
          print("Current run replay/probe regression PASS:",
                report["decision"]["current_run_replay_consistency_pass"])
          print("Known historical failures mean long-term stability is unproven.")
          assert report["decision"]["recommended_adoption"] == "NO_GO"
          assert report["decision"]["performance_100_iterations_valid"], "fewer than 100 valid branch iterations"
          assert bench["iterations"] == 120
          assert bench["unique_fixture_count"] == 5, "fixture count changed; inspect coverage"
          assert bench["scenario_kind_count"] == 6
          assert bench["manifest_case_count"] == 6
          assert bench["validated_manifest_case_count"] <= 6
          assert bench["distinct_mechanism_tag_count"] > 6
          assert len(bench["missing_required_groups"]) > 0
          assert len(bench["evaluated_manifest_cases"]) == 6
          assert all(x.get("case_id") and x.get("preconditions") and x.get("expected")
                     and x.get("mechanism_tags") and x.get("actual")
                     for x in bench["evaluated_manifest_cases"])
          assert bench["representative_100_cases_met"] is False
          assert report["decision"]["representative_100_cases_met"] is False
          assert report["decision"]["phase0_100_case_performance_requirement_met"] is False
          assert report["decision"]["phase0_replay_acceptance_met"] is False
          assert report["decision"]["benchmark_manifest_case_count"] == 6
          assert report["decision"]["benchmark_distinct_mechanism_tags"] > 6
          assert len(bench["unique_fixture_sha256"]) == bench["unique_fixture_count"]
          assert report["probe"]["format_mod"] == "champions"
          assert bench["counts"]["branch_resolved"] >= 100, "fewer than 100 resolved synthetic iterations"
          assert bench["counts"]["branch_resolved"] + bench["counts"]["unsupported"] == 120
          assert report["decision"]["synthetic_replay_all_consistent"] == (
              bench["counts"]["unsupported"] == 0)
          assert report["decision"]["synthetic_replay_failure_count"] == bench["counts"]["unsupported"]
          assert bench["counts"]["choice_legal"] >= 100, "fewer than 100 legal action attempts"
          probe_kinds = ("normal", "hp_status_pp_boost", "item_choice",
                         "weather_screens", "consumed_item", "forced_switch", "unknown_sets")
          failed_probes = {}
          for kind in probe_kinds:
              result = report["probe"]["results"][kind]
              assert result["status"] in ("PASS_SYNTHETIC", "UNSUPPORTED"), kind
              if result["status"] == "UNSUPPORTED":
                  assert result.get("detail"), "unexplained probe failure: " + kind
                  failed_probes[kind] = result["detail"]
          print("Unresolved synthetic probe failures (not treated as PASS):", failed_probes)
          assert sum(report["probe"]["results"][kind]["status"] == "PASS_SYNTHETIC"
                     for kind in probe_kinds) >= 4, "too few diagnostic probes passed"
          normal = report["probe"]["results"]["normal"]
          if normal["status"] == "PASS_SYNTHETIC":
              assert normal["next_turn_verified"], "two-turn fork unverified"
          choice = report["probe"]["results"]["item_choice"]
          if choice["status"] == "PASS_SYNTHETIC":
              assert choice["serialized_values_compared"], "effects not compared"
          assert report["decision"]["gate_B_midbattle"] == "UNSUPPORTED", "do not certify midbattle gate"
          pending = report["probe"]["results"]["pending_choice"]
          assert pending["status"] in ("PASS_SYNTHETIC", "UNSUPPORTED")
          if pending["status"] == "PASS_SYNTHETIC":
              assert pending["resolved_same_after_copy"]
          else:
              assert pending["restoration_status"] == "UNSUPPORTED"
              assert pending["safe_for_midbattle_reconstruction"] is False
              print("Explicit midbattle blocker (not a passing case):", pending["detail"])
          import os
          meta = {k: report[k] for k in ("schema", "timestamp_utc", "pinned_sha", "context", "decision")}
          print("PHASE0_META_JSON=" + json.dumps(meta, ensure_ascii=False, sort_keys=True))
          for index, sample in enumerate(bench["timings"]):
              print("PHASE0_SAMPLE_JSON=" + json.dumps({"index": index, **sample}, ensure_ascii=False, sort_keys=True))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("### Phase 0 synthetic benchmark (NOT Champions game proof)\\n")
                  out.write("Head SHA: `" + os.environ["CHECKED_OUT_HEAD"] + "`\\n\\n")
                  out.write("Iterations / unique SHA / manifest cases / mechanism tags: `" +
                            str((bench["iterations"], bench["unique_fixture_count"],
                                 bench["validated_manifest_case_count"],
                                 bench["distinct_mechanism_tag_count"])) + "`\\n\\n")
                  out.write("Uncovered required mechanism groups: `" +
                            json.dumps(bench["missing_required_groups"]) + "`\\n\\n")
                  out.write("100 representative cases: **NOT MET**\\n\\n")
                  out.write("Diagnostic CI outcome (test execution): **evaluated**\\n\\n")
                  out.write("Current-run replay/probe consistency: **" +
                            str(report["decision"]["current_run_replay_consistency_pass"]) + "**\\n\\n")
                  out.write("Phase 0 replay acceptance: **NOT MET** (independent multi-run evidence absent)\\n\\n")
                  out.write("All 120 repeated branches consistent: **" +
                            str(report["decision"]["synthetic_replay_all_consistent"]) + "**\\n\\n")
                  out.write("Regression failures: `" +
                            str(report["decision"]["replay_regression_failures"]) + "`\\n\\n")
                  out.write("Divergent/unsupported branches: " +
                            str(bench["counts"]["unsupported"]) + "\\n\\n")
                  out.write("Node stage timings: `" + json.dumps(bench["stage_latency_ms"]) + "`\\n\\n")
                  out.write("Categories: `" + json.dumps(bench["by_kind"], ensure_ascii=False) + "`\\n\\n")
                  out.write("Stage totals: `" + json.dumps(bench["counts"]) + "`\\n\\n")
                  out.write("P50/P95/P99 ms: " + str((bench["p50_ms"], bench["p95_ms"], bench["p99_ms"])) + "\\n")
          PY
      - name: Audit source-data parity (not game certification)
        run: |
          docker run --rm --entrypoint node champions-phase0 audit.cjs > phase0-audit.json
          python3 - <<'PY'
          import json
          with open("phase0-audit.json", encoding="utf-8") as f:
              audit = json.load(f)
          print("Source comparison:", audit["format"], audit["upstream_sha"])
          print("Categories:", audit["totals"])
          print("Mismatch count:", audit["mismatch_count"])
          print("Provisional root-cause triage:", audit["provisional_cause_counts"])
          assert audit["classification_status"].startswith("UNVERIFIED")
          assert len(audit["mismatch_details"]) == audit["mismatch_count"]
          assert sum(audit["provisional_cause_counts"].values()) == audit["mismatch_count"]
          assert all(not x["cause_verified"] and x["validation_status"] == "UNKNOWN"
                     for x in audit["mismatch_details"])
          print("Sample discrepancies:", audit["mismatch_examples"][:8])
          assert audit["status"] == "DIAGNOSTIC_ONLY", audit.get("reason")
          assert len(audit["master_sha256"]) == 4, "source SHA coverage"
          assert audit["totals"]["move_coverage"]["checked"] > 0
          print("PHASE0_AUDIT_SOURCE_SHA256=" + json.dumps(audit["master_sha256"], sort_keys=True))
          for item in audit["mismatch_details"]:
              print("PHASE0_AUDIT_MISMATCH_JSON=" + json.dumps(item, ensure_ascii=False, sort_keys=True))
          import os
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as out:
                  out.write("\\n### Static master audit (NOT game certification)\\n")
                  out.write("Inputs SHA256: `" + json.dumps(audit["master_sha256"], sort_keys=True) + "`\\n\\n")
                  out.write("Mismatch count: " + str(audit["mismatch_count"]) + "\\n")
                  out.write("Provisional A/B/C/D/E: `" + json.dumps(audit["provisional_cause_counts"]) + "`\\n")
          PY
      - name: Assert audit fails closed without a required master
        run: |
          set +e
          docker run --rm -e CHAMPIONS_MASTERS_DIR=/nonexistent-source-directory \
            --entrypoint node champions-phase0 audit.cjs > phase0-missing-master.json
          status=$?
          set -e
          test "$status" -ne 0
          python3 - <<'PY'
          import json
          with open("phase0-missing-master.json", encoding="utf-8") as f:
              result = json.load(f)
          assert result["status"] == "NOT_RUN"
          print("Missing source correctly rejected:", result["status"])
          PY
      - name: Remove unneeded measurement file
        if: always()
        run: rm -f phase0-result.json phase0-audit.json phase0-missing-master.json phase0-event-probe.json

  phase0-windows-native-node:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Phase 0 revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source and Champions master inputs
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED_HEAD) {
            throw 'Phase 0 checkout does not match expected HEAD'
          }
          $expected = @{
            'Pokemon_Champions_MC_move_master.csv' = '39497369e1f47891da453894f256bef6c44085abea4c5c94b8288c05b31f06a5'
            'Pokemon_Champions_MC_usable_pokemon.csv' = '5a2aac25586a2d45797bec18b9a81958e2eee5544beb32d39ea6cf93d720e3ee'
            'Pokemon_Champions_MC_pokemon_learnsets_linked.csv' = '30305983e5ac676be27fc2f148e2326963830f2ab201845e812c93c008ebabe6'
            'Pokemon_Champions_MC_usable_held_items.csv' = 'fbf36aeff9906cbdf4e82bae575340d1df640187ce469ae9d31194a92faa16c8'
          }
          foreach ($file in $expected.Keys) {
            $source = Join-Path 'masters' $file
            if (-not (Test-Path $source)) { throw 'Champions master missing' }
            $actual = (Get-FileHash -Path $source -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$file]) {
              throw "Pinned Champions master bytes differ on Windows: $file ($actual)"
            }
          }
          Write-Host 'Pinned Champions masters verified byte-for-byte on Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Fetch and build fixed Showdown commit on native Windows
        shell: pwsh
        run: |
          $sha = 'ccfaa20f32af363569cd21a9d501b2bc1ded26b1'
          $root = Join-Path $env:RUNNER_TEMP 'champions-showdown-fixed'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          git -C $root init
          git -C $root remote add origin https://github.com/smogon/pokemon-showdown.git
          git -C $root fetch --depth=1 origin $sha
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Showdown git fetch failed' }
          git -C $root checkout --detach FETCH_HEAD
          if ((git -C $root rev-parse HEAD).Trim() -ne $sha) { throw 'Showdown SHA mismatch' }
          Push-Location $root
          try {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Showdown npm ci failed' }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Showdown build failed' }
            if (-not (Test-Path 'dist/sim/index.js')) { throw 'Built simulator missing' }
          } finally { Pop-Location }
          "SHOWDOWN_ROOT=$root" >> $env:GITHUB_ENV
          "CHAMPIONS_MASTERS_DIR=$env:GITHUB_WORKSPACE\masters" >> $env:GITHUB_ENV
      - name: Test native Windows Showdown selection and restore
        shell: pwsh
        working-directory: poc/showdown_phase0
        run: |
          node --test test_gate_b_probe.cjs test_six_team_selection_probe.cjs test_cross_process_synthetic_probe.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows native Showdown Node tests failed' }
      - name: Diagnose three native Windows Node process replays
        shell: pwsh
        working-directory: poc/showdown_phase0
        run: |
          $json = node cross_process_synthetic_probe.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows native synthetic replay failed' }
          $r = $json | ConvertFrom-Json
          if ($r.schema -ne 'phase0-cross-process-synthetic-validation-v1' -or
              $r.platform -ne 'win32' -or
              $r.independent_os_process_count -ne 3 -or
              $r.cases_per_process -ne 127 -or
              $r.total_case_invocations -ne 381 -or
              $r.cross_process_signatures_equal -ne $true -or
              $r.game_compatibility_verified -ne $false -or
              $r.windows_gui_ipc_e2e_verified -ne $false -or
              $r.gate_A -ne 'UNKNOWN' -or $r.gate_B -ne 'UNSUPPORTED' -or
              $r.adoption -ne 'NO_GO') { throw 'Windows synthetic verdict changed' }
          Write-Host 'Windows native Node synthetic replay: 127 x 3 success'
          Write-Host ('Process wall ms: ' + ($r.process_wall_ms | ConvertTo-Json -Compress))
          Write-Host ('Stage ms: ' + ($r.node_stage_ms.values | ConvertTo-Json -Compress))
          Write-Host 'Windows GUI/IPC and Champions actual-game verification: NOT TESTED'

