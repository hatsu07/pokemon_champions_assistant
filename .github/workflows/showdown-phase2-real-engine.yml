name: Phase 2 pinned Showdown real-engine integration

# Unlike the isolated fake-engine CI, this job builds the actual pinned
# upstream simulator and runs synthetic Battle/RNG fixtures against it.
# It is not Champions real-game compatibility certification.
on:
  pull_request:
    paths:
      - 'local_simulator/**'
      - 'src/champions_assist/local_strategy/champions_master_key_candidates.py'
      - 'masters/Pokemon_Champions_MC_team_2026-10-03.csv'
      - 'masters/Pokemon_Champions_MC_move_master.csv'
      - 'masters/Pokemon_Champions_MC_pokemon_learnsets_linked.csv'
      - 'masters/Pokemon_Champions_MC_usable_pokemon.csv'
      - 'src/champions_assist/preload.py'
      - 'src/champions_assist/local_strategy/roster_mapping_readiness.py'
      - 'scripts/report_phase2_champions_key_candidates.py'
      - 'scripts/report_phase2_static_move_compat.py'
      - 'src/champions_assist/local_strategy/static_move_compatibility.py'
      - 'tests/test_issue_141_stage1_static_compat.py'
      - 'src/champions_assist/local_strategy/engine_replay_readout_bridge.py'
      - 'tests/test_issue_141_engine_replay_readout_bridge.py'
      - 'tests/test_issue_141_window_bound_readout_transport.py'
      - 'tests/test_issue_141_observed_safe_branch_gate.py'
      - 'tests/test_issue_141_observed_synthetic_replay_bridge.py'
      - 'tests/test_issue_141_observed_full_grid_diagnostic.py'
      - 'src/champions_assist/local_strategy/observed_synthetic_replay_bridge.py'
      - 'src/champions_assist/local_strategy/observed_full_grid_diagnostic.py'
      - '.github/workflows/showdown-phase2-real-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-real-engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-showdown-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify test source HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Checkout exact upstream Showdown SHA
        uses: actions/checkout@v4
        with:
          repository: smogon/pokemon-showdown
          ref: ccfaa20f32af363569cd21a9d501b2bc1ded26b1
          path: pinned-showdown
          persist-credentials: false
      - name: Verify upstream SHA, lockfile and source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C pinned-showdown rev-parse HEAD)" = "ccfaa20f32af363569cd21a9d501b2bc1ded26b1"
          test -f pinned-showdown/package-lock.json
          test -f pinned-showdown/LICENSE
          echo "Real upstream SHA: $(git -C pinned-showdown rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install exact upstream locked dependencies (no lifecycle scripts)
        working-directory: pinned-showdown
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build pinned Showdown simulator
        working-directory: pinned-showdown
        run: |
          npm run build
          test -f dist/sim/index.js
      - name: Real Showdown Battle / P2 request integration
        env:
          SHOWDOWN_PINNED_BUILD_ROOT: ${{ github.workspace }}/pinned-showdown
          READOUT_E2E_FIXTURE_PATH: ${{ runner.temp }}/issue141-pinned-complete-battle.json
        run: node --test local_simulator/test_real_pinned_showdown.cjs
      - name: Actual pinned Showdown to verified worker to Python READOUT E2E
        env:
          SHOWDOWN_PINNED_BUILD_ROOT: ${{ github.workspace }}/pinned-showdown
          READOUT_E2E_FIXTURE_PATH: ${{ runner.temp }}/issue141-pinned-complete-battle.json
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "$READOUT_E2E_FIXTURE_PATH"
          python -m unittest -v tests.test_issue_141_real_worker_python_e2e
      - name: Generate authentic Champions fixed-master key candidates
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
          CHAMPIONS_SOURCE_KEY_CANDIDATES_JSON: ${{ runner.temp }}/issue141-source-key-candidates.json
        run: |
          set -euo pipefail
          python scripts/report_phase2_champions_key_candidates.py --masters-dir masters > "$CHAMPIONS_SOURCE_KEY_CANDIDATES_JSON"
          python -m json.tool "$CHAMPIONS_SOURCE_KEY_CANDIDATES_JSON" > /dev/null
      - name: Actual pinned Champions Dex ID existence for registered team
        env:
          SHOWDOWN_PINNED_BUILD_ROOT: ${{ github.workspace }}/pinned-showdown
          CHAMPIONS_SOURCE_KEY_CANDIDATES_JSON: ${{ runner.temp }}/issue141-source-key-candidates.json
        run: node --test local_simulator/test_real_pinned_champions_roster_lookup.cjs
      - name: Generate exact static move fields from Champions fixed masters
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
          CHAMPIONS_STATIC_MOVES_JSON: ${{ runner.temp }}/issue141-static-24.json
        run: |
          set -euo pipefail
          python scripts/report_phase2_static_move_compat.py --masters-dir masters > "$CHAMPIONS_STATIC_MOVES_JSON"
          python -m json.tool "$CHAMPIONS_STATIC_MOVES_JSON" > /dev/null
      - name: Compare static fields to actual pinned Champions Dex
        env:
          SHOWDOWN_PINNED_BUILD_ROOT: ${{ github.workspace }}/pinned-showdown
          CHAMPIONS_STATIC_MOVES_JSON: ${{ runner.temp }}/issue141-static-24.json
        run: node --test local_simulator/test_real_pinned_static_move_compat.cjs
      - name: Metadata boundary and no LIVE promotion
        if: always()
        run: echo 'Dex entry existence is NOT Champions game compatibility, Mega-Z support, legality or LIVE ranking.' >> "$GITHUB_STEP_SUMMARY"
      - name: Explicit validity boundary
        if: always()
        shell: bash
        run: |
          echo "Built upstream pinned Showdown and ran SYNTHETIC 3v3 fixtures; NOT game observations." >> "$GITHUB_STEP_SUMMARY"
          echo "No proof of all legal Champions choices or complete midbattle reconstruction." >> "$GITHUB_STEP_SUMMARY"
          echo "No runtime promotion to LIVE/GPT or production installer." >> "$GITHUB_STEP_SUMMARY"
