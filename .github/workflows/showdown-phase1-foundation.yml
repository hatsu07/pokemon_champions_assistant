name: Phase 1 isolated foundation tests

on:
  pull_request:
    paths:
      - 'src/champions_assist/local_strategy/**'
      - 'local_simulator/**'
      - 'tests/test_issue_140_foundation.py'
      - 'tests/test_issue_141_selection.py'
      - 'tests/test_issue_141_one_turn.py'
      - 'tests/test_issue_141_shadow_runner.py'
      - 'tests/test_issue_141_opponent_evidence_gate.py'
      - 'tests/test_issue_141_joint_set_intake.py'
      - 'tests/test_issue_141_opponent_request.py'
      - 'tests/test_issue_141_engine_p2_transport.py'
      - 'tests/test_issue_141_observed_id_bridge.py'
      - 'tests/test_issue_141_observed_provenance_gate.py'
      - 'tests/test_issue_141_capture_receipts.py'
      - 'tests/test_issue_141_observed_ocr_scenario_bridge.py'
      - 'tests/test_issue_141_observed_opponent_actions.py'
      - 'tests/test_issue_141_observed_safe_branch_gate.py'
      - 'tests/test_issue_141_observed_synthetic_replay_bridge.py'
      - 'tests/test_issue_141_observed_full_grid_diagnostic.py'
      - 'tests/test_issue_141_phase2_456_audits.py'
      - 'tests/test_issue_141_phase2_match_audit.py'
      - 'tests/test_issue_141_device_shadow_evidence_link.py'
      - 'tests/test_issue_141_gui_timing_trace_audit.py'
      - 'tests/test_issue_141_consolidated_2to6.py'
      - 'tests/test_issue_141_stage1_conditional_prep_builder.py'
      - 'src/champions_assist/local_strategy/conditional_prep_builder.py'
      - 'src/champions_assist/local_strategy/static_move_compatibility.py'
      - 'scripts/report_phase2_static_move_compat.py'
      - 'tests/test_issue_141_stage1_static_compat.py'
      - 'tests/test_issue_141_stage1_parallel_shadow.py'
      - 'src/champions_assist/local_strategy/parallel_shadow_session.py'
      - 'src/champions_assist/local_strategy/conditional_preview_pipeline.py'
      - 'src/champions_assist/local_strategy/prep18_audit.py'
      - 'tests/test_issue_141_stage1_preview_pipeline.py'
      - 'tests/test_issue_141_stage1_live_shadow_dispatch.py'
      - 'tests/test_issue_141_stage1_ui_shadow_dispatcher.py'
      - 'tests/test_issue_141_stage1_qt_shadow_wiring.py'
      - 'src/champions_assist/local_strategy/live_shadow_dispatch.py'
      - 'src/champions_assist/local_strategy/ui_shadow_dispatcher.py'
      - 'src/champions_assist/match_replay_dialog.py'
      - 'local_simulator/test_pinned_move_static_comparison.cjs'
      - 'src/champions_assist/local_strategy/registered_team_source_binding.py'
      - 'src/champions_assist/local_strategy/consolidated_phase2_audit.py'
      - 'scripts/report_phase2_2to6.py'
      - 'src/champions_assist/team_management.py'
      - 'src/champions_assist/team_prep_readiness.py'
      - 'src/champions_assist/team_live_assets.py'
      - 'masters/Pokemon_Champions_MC_team_2026-10-03.csv'
      - 'docs/ISSUE_141_CONSOLIDATED_PHASE2_2TO6.md'
      - 'src/champions_assist/local_strategy/gui_timing_trace_audit.py'
      - 'scripts/audit_phase2_gui_timing_export.py'
      - 'src/champions_assist/match_replay_dialog.py'
      - 'src/champions_assist/local_strategy/device_shadow_evidence_link.py'
      - 'scripts/report_phase2_device_shadow_link.py'
      - 'docs/ISSUE_141_DEVICE_SHADOW_LINK.md'
      - 'tests/test_issue_141_roster_mapping_readiness.py'
      - 'tests/test_issue_141_champions_key_candidates.py'
      - 'scripts/report_phase2_champions_key_candidates.py'
      - 'docs/ISSUE_141_CHAMPIONS_KEY_CANDIDATES.md'
      - 'scripts/report_phase2_roster_readiness.py'
      - 'docs/ISSUE_141_ROSTER_BINDING_BLOCKER.md'
      - 'src/champions_assist/local_strategy/phase2_match_audit.py'
      - 'docs/ISSUE_141_PHASE2_MATCH_AUDIT.md'
      - 'src/champions_assist/local_strategy/observed_full_grid_diagnostic.py'
      - 'tests/test_issue_141_replay_projection_audit.py'
      - 'tests/test_issue_141_engine_replay_readout_bridge.py'
      - 'tests/test_issue_141_window_bound_readout_transport.py'
      - 'tests/test_verify_merge_ready.py'
      - 'scripts/verify_merge_ready.py'
      - '.github/workflows/showdown-phase1-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-isolated-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check actual checkout SHA
        shell: bash
        run: |
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$ACTUAL" = "$EXPECTED" || exit 1
          echo "Checked-out SHA: $ACTUAL" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python project for existing validator imports
        run: python -m pip install -e .
      - name: Python contract and failure tests
        run: python -m unittest tests.test_issue_140_foundation tests.test_issue_141_selection tests.test_issue_141_one_turn tests.test_issue_141_shadow_runner tests.test_issue_141_opponent_evidence_gate tests.test_issue_141_joint_set_intake tests.test_issue_141_opponent_request tests.test_issue_141_engine_p2_transport tests.test_issue_141_observed_id_bridge tests.test_issue_141_observed_provenance_gate tests.test_issue_141_capture_receipts tests.test_issue_141_observed_ocr_scenario_bridge tests.test_issue_141_observed_opponent_actions tests.test_issue_141_observed_safe_branch_gate tests.test_issue_141_observed_synthetic_replay_bridge tests.test_issue_141_observed_full_grid_diagnostic tests.test_issue_141_phase2_456_audits tests.test_issue_141_phase2_match_audit tests.test_issue_141_device_shadow_evidence_link tests.test_issue_141_gui_timing_trace_audit tests.test_issue_141_consolidated_2to6 tests.test_issue_141_stage1_conditional_prep_builder tests.test_issue_141_stage1_static_compat tests.test_issue_141_stage1_parallel_shadow tests.test_issue_141_stage1_preview_pipeline tests.test_issue_141_stage1_live_shadow_dispatch tests.test_issue_141_stage1_ui_shadow_dispatcher tests.test_issue_141_stage1_qt_shadow_wiring tests.test_issue_141_roster_mapping_readiness tests.test_issue_141_champions_key_candidates tests.test_issue_141_replay_projection_audit tests.test_issue_141_engine_replay_readout_bridge tests.test_issue_141_window_bound_readout_transport tests.test_verify_merge_ready -v
      - name: Node protocol tests (unbundled, no real Showdown)
        run: node --test local_simulator/test_worker.cjs local_simulator/test_p2_engine_choices.cjs local_simulator/test_observed_replay_audit.cjs local_simulator/test_pinned_replay_readout.cjs local_simulator/test_pinned_champions_roster_lookup.cjs local_simulator/test_pinned_move_static_comparison.cjs
      - name: Explicit limits
        run: |
          echo "CI covers isolated contracts only; no real-game compatibility." >> "$GITHUB_STEP_SUMMARY"
          echo "No Windows runtime bundle or production tactical integration." >> "$GITHUB_STEP_SUMMARY"
