[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-champions-assistant"
version = "0.1.0"
description = "Observer-only local Pokémon Champions assistance core"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.18,<5",
    "openai>=2.0,<3",
    "PyJWT[crypto]>=2.9,<3",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10,<12",
    "pytesseract>=0.3.10,<0.4",
    "PySide6-Essentials>=6.8,<7",
]

[project.scripts]
champions-assist = "champions_assist.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
